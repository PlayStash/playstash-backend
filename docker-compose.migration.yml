version: "3.8"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playstash
      POSTGRES_PASSWORD: playstash
      POSTGRES_DB: playstash
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U pgweb -h 127.0.0.1
      interval: 5s
  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://playstash:playstash@db:5432/playstash?sslmode=disable
    ports:
      - 8081:8081
    depends_on: 
      db:
        condition: service_healthy