name: Build and release server

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: server-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo 'Version tag does not match package.json.' >&2
            exit 1
          fi
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.image.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ strategy.job-index }}
          cache-to: type=gha,mode=max,scope=server-${{ strategy.job-index }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: server-digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ always() && needs.docker.result == 'success' && (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped') }}
    needs: [docker, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          refs=()
          for digest in digests/*; do refs+=("$image@sha256:$(basename "$digest")"); done
          tags=(-t "$image:sha-${GITHUB_SHA:0:12}")
          if [ "$REF_NAME" = dev ]; then
            tags+=(-t "$image:dev")
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
            exit 0
          fi

          tags+=(-t "$image:latest")
          publish_release=false
          create_draft=false
          # REST releases/tags cannot discover drafts with a pending tag.
          query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { id release(tagName: $tag) { databaseId isDraft } } }'
          if ! gh api graphql -f query="$query" -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F tag="$tag" > release-query.json 2> release-error.log; then
            cat release-error.log >&2
            exit 1
          fi
          release_id=$(node -e '
            const response = JSON.parse(require("node:fs").readFileSync("release-query.json", "utf8"));
            const repository = response.data?.repository;
            if ((response.errors != null && (!Array.isArray(response.errors) || response.errors.length > 0)) ||
                !repository || typeof repository.id !== "string" || !Object.hasOwn(repository, "release")) {
              throw new Error("Release lookup returned invalid repository metadata; refusing to publish images.");
            }
            const release = repository.release;
            if (release !== null) {
              if (!release || !Number.isSafeInteger(release.databaseId) || release.databaseId <= 0 || typeof release.isDraft !== "boolean") {
                throw new Error("Release lookup returned invalid release metadata; refusing to publish images.");
              }
              console.log(release.databaseId);
            }
          ')
          if [ -n "$release_id" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release-state.json 2> release-error.log; then
              cat release-error.log >&2
              exit 1
            fi
            node -e '
              const release = JSON.parse(require("node:fs").readFileSync("release-state.json", "utf8"));
              if (release.id !== Number(process.argv[1]) || release.tag_name !== process.argv[2] ||
                  typeof release.draft !== "boolean" || typeof release.target_commitish !== "string") {
                throw new Error("Release details returned invalid metadata; refusing to publish images.");
              }
            ' "$release_id" "$tag"
            draft=$(jq -r .draft release-state.json)
            if [ "$draft" = true ]; then
              if [ "$(jq -r .target_commitish release-state.json)" != "$GITHUB_SHA" ]; then
                echo 'The existing draft belongs to a different commit; use a new version.' >&2
                exit 1
              fi
              publish_release=true
            elif [ "$draft" != false ]; then
              echo 'Release lookup returned invalid metadata; refusing to publish images.' >&2
              exit 1
            fi
          else
            create_draft=true
            publish_release=true
          fi

          if [ "$publish_release" = true ]; then
            node scripts/release-notes.mjs "$version" > release-notes.md
            printf '\nContainer: `%s:%s` (Linux amd64 and arm64).\n' "$image" "$tag" >> release-notes.md
            # Reserve this version for this commit before touching its image tag.
            if [ "$create_draft" = true ]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "PlayStash Server $version" --notes-file release-notes.md
            else
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
            fi
            tags+=(-t "$image:$tag")
          fi

          # Existing published version tags remain unchanged; latest/sha can advance.
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          if [ "$publish_release" = true ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  sonarcloud:
    needs: test
    if: ${{ vars.PLAYSTASH_SONAR_PROJECT_KEY != '' && vars.PLAYSTASH_SONAR_ORGANIZATION != '' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.PLAYSTASH_SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.PLAYSTASH_SONAR_ORGANIZATION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
