name: Test

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ vars.PLAYSTASH_RUN_WORKFLOWS == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:cov --maxWorkers=2

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Verify fresh SQLite schema
        run: pnpm check:fresh-schema sqlite

      - name: Verify compiled Socket.IO DTOs and validation
        run: node scripts/check-chat-runtime.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  postgres-migrations:
    if: ${{ vars.PLAYSTASH_RUN_WORKFLOWS == 'true' }}
    name: Postgres migrations
    runs-on: ubuntu-latest

    # The unit/e2e suite only executes the SQLite migrations (in-memory DB), so
    # the Postgres ones are verified separately against a real server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: playstash
          POSTGRES_PASSWORD: playstash
          POSTGRES_DB: playstash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Postgres migrations
        env:
          PLAYSTASH_TEST_DATABASE_URL: postgresql://playstash:playstash@127.0.0.1:5432/playstash
        run: pnpm check:fresh-schema postgres
