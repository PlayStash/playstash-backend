name: Security checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts='--all' --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/secrets.json"
      - name: Keep redacted findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redacted-secret-scan
          path: ${{ runner.temp }}/secrets.json
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Audit all production and development packages
        run: pnpm audit --audit-level=low

  published-containers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Download and verify pinned container scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy"
      - name: Check published backend, frontend and PostgreSQL images
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          "$RUNNER_TEMP/trivy/trivy" image --platform "$PLATFORM" --scanners vuln --ignorefile /dev/null --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --format json --output "$RUNNER_TEMP/server.json" ghcr.io/playstash/playstash-backend:latest || status=1
          "$RUNNER_TEMP/trivy/trivy" image --platform "$PLATFORM" --scanners vuln --ignorefile /dev/null --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --format json --output "$RUNNER_TEMP/postgres.json" ghcr.io/playstash/playstash-backend:postgres16 || status=1
          "$RUNNER_TEMP/trivy/trivy" image --platform "$PLATFORM" --scanners vuln --ignorefile /dev/null --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --format json --output "$RUNNER_TEMP/frontend.json" ghcr.io/playstash/playstash-backend:frontend || status=1
          exit "$status"
      - name: Keep runtime vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-container-audit-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/server.json
            ${{ runner.temp }}/postgres.json
            ${{ runner.temp }}/frontend.json
          if-no-files-found: ignore
          retention-days: 14
