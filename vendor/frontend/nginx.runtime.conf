worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Avoid recording query parameters, credentials or request headers in logs.
    log_format public '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout public;

    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /tmp/nginx/trusted-realip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    geo $realip_remote_addr $trusted_proxy {
        default 0;
        include /tmp/nginx/trusted-geo.conf;
    }
    map "$trusted_proxy:$http_x_forwarded_proto" $public_scheme {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map "$status:$uri" $asset_cache_control {
        ~^[0-9]+:/(api|socket\.io)(/|$) "";
        default "no-cache";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }
    map $uri $frontend_csp {
        # API docs/OAuth retain the backend policy, including Swagger initialization.
        ~^/(api|socket\.io)(/|$) "";
        default "default-src 'self'; connect-src 'self' http: https: ws: wss:; font-src 'self' data: https://rsms.me; img-src 'self' http: https: data: blob:; media-src 'self' http: https: blob:; frame-src https:; style-src 'self' 'unsafe-inline' https://rsms.me/inter/inter.css; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';";
    }

    # Docker DNS is re-resolved after backend replacement, without nginx restart.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        set $backend playstash-backend:8080;

        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        # Replace untrusted chains with the verified client/peer address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Powered-By;

        add_header Content-Security-Policy $frontend_csp always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "microphone=(), camera=(), payment=()" always;
        add_header Cache-Control $asset_cache_control always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            proxy_pass http://$backend$request_uri;
        }
        location ^~ /api/ {
            proxy_pass http://$backend$request_uri;
        }
        location = /socket.io {
            proxy_pass http://$backend$request_uri;
        }
        location ^~ /socket.io/ {
            proxy_pass http://$backend$request_uri;
        }
        location ^~ /assets/ {
            try_files $uri =404;
        }
        location ~ /\. {
            deny all;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

