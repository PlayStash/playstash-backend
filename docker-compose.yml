services:
  playstash-backend:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USERNAME: playstash
      DB_PASSWORD: RANDOMPASSWORD
    ports:
      - 8080:8080
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playstash
      POSTGRES_PASSWORD: RANDOMPASSWORD
      POSTGRES_DB: playstash
