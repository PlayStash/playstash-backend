services:
  playstash-init:
    image: ghcr.io/playstash/playstash-backend:latest
    pull_policy: always
    restart: "no"
    entrypoint: ["node", "/opt/playstash/init-postgres.mjs"]
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./data/secrets:/run/playstash-secrets
  db:
    image: ghcr.io/playstash/playstash-backend:postgres16
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: playstash
      POSTGRES_PASSWORD_FILE: /run/playstash-secrets/postgres-password
      POSTGRES_DB: playstash
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/secrets:/run/playstash-secrets:ro
    depends_on:
      playstash-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U playstash -d playstash"]
      interval: 5s
      timeout: 5s
      retries: 20
  playstash-backend:
    image: ghcr.io/playstash/playstash-backend:latest
    pull_policy: always
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DB_SYSTEM: POSTGRESQL
      DB_HOST: db
      DB_USERNAME: playstash
      DB_DATABASE: playstash
      DB_PASSWORD_FILE: /run/playstash-secrets/postgres-password
      AUTH_SEED_PERSIST: "true"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    ports:
      - "${PLAYSTASH_PORT:-8080}:8080"
    volumes:
      - ./data/config:/config
      - ./data/db:/db
      - ./data/media:/media
      - ./data/logs:/logs
      - ./data/plugins:/plugins
      - ./data/savefiles:/savefiles
      - ./games:/files
      - ./data/secrets:/run/playstash-secrets:ro
    depends_on:
      db:
        condition: service_healthy
      playstash-init:
        condition: service_completed_successfully
